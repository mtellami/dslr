[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dslr"
version = "0.1.0"
description = "Descriptive statistics, visual exploration, and logistic regression from scratch"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mtellami", email = "moadtell@gmail.com" }]
dependencies = ["numpy>=1.20", "matplotlib>=3.5"]

[project.scripts]
dslr-describe = "dslr.commands.describe:main"

[tool.setuptools.packages.find]
where = ["src"]
