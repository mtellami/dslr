[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dslr"
version = "0.1.0"
description = "Descriptive statistics, visual exploration, and logistic regression from scratch"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "mtellami", email = "moadtell@gmail.com" }]
dependencies = ["numpy>=1.20", "matplotlib>=3.5"]

[project.scripts]
dslr-describe = "dslr.commands.describe:main"
dslr-histogram = "dslr.commands.histogram:main"
dslr-scatter-plot = "dslr.commands.scatter_plot:main"
dslr-pair-plot = "dslr.commands.pair_plot:main"
dslr-logreg-train = "dslr.commands.logreg_train:main"
dslr-logreg-predict = "dslr.commands.logreg_predict:main"

[tool.setuptools.packages.find]
where = ["src"]
